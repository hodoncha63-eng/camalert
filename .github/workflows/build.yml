name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write app source
        run: |
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF_SRC'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.camalert"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.camalert"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 2
                  versionName = "1.1"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("com.google.android.gms:play-services-location:21.3.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.core:core-ktx:1.13.1")
          }
          EOF_SRC
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_SRC'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:label="단속카메라 알림"
                  android:theme="@style/Theme.AppCompat.DayNight">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".AlertService"
                      android:exported="false"
                      android:foregroundServiceType="location" />

                  <receiver android:name=".CarConnectionReceiver" android:exported="true">
                      <intent-filter>
                          <action android:name="android.bluetooth.device.action.ACL_CONNECTED" />
                          <action android:name="android.bluetooth.device.action.ACL_DISCONNECTED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF_SRC
          mkdir -p app/src/main/assets
          cat > app/src/main/assets/cameras.csv <<'EOF_SRC'
          id,lat,lng,speed_limit,type
          SAMPLE-1,37.5665,126.9780,50,fixed
          SAMPLE-2,37.5700,126.9820,60,fixed
          EOF_SRC
          mkdir -p app/src/main/java/com/example/camalert
          cat > app/src/main/java/com/example/camalert/AlertService.kt <<'EOF_SRC'
          package com.example.camalert
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.location.Location
          import android.media.AudioAttributes
          import android.media.AudioFocusRequest
          import android.media.AudioManager
          import android.os.IBinder
          import android.os.Looper
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import androidx.core.app.NotificationCompat
          import androidx.core.app.ServiceCompat
          import com.google.android.gms.location.*
          class AlertService : Service(), TextToSpeech.OnInitListener {
              private lateinit var tts: TextToSpeech
              private lateinit var fused: FusedLocationProviderClient
              private lateinit var audio: AudioManager
              private var focusReq: AudioFocusRequest? = null
              private var cameras: List<Camera> = emptyList()
              private var ttsReady = false
              private var lastId: String? = null
              private var lastLevel = Int.MAX_VALUE
              private val levels = intArrayOf(500, 300, 100)
              private val attrs = AudioAttributes.Builder()
                  .setUsage(AudioAttributes.USAGE_ASSISTANCE_NAVIGATION_GUIDANCE)
                  .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                  .build()
              private val callback = object : LocationCallback() {
                  override fun onLocationResult(r: LocationResult) { r.lastLocation?.let(::handle) }
              }
              override fun onCreate() {
                  super.onCreate()
                  audio = getSystemService(AudioManager::class.java)
                  val ch = "cam_alert"
                  getSystemService(NotificationManager::class.java)
                      .createNotificationChannel(NotificationChannel(ch, "단속카메라 알림", NotificationManager.IMPORTANCE_LOW))
                  val n = NotificationCompat.Builder(this, ch)
                      .setContentTitle("단속카메라 알림 작동 중")
                      .setSmallIcon(android.R.drawable.ic_menu_mylocation)
                      .setOngoing(true).build()
                  ServiceCompat.startForeground(this, 1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_LOCATION)
                  cameras = CameraRepository.load(this)
                  tts = TextToSpeech(this, this)
                  fused = LocationServices.getFusedLocationProviderClient(this)
                  val req = LocationRequest.Builder(Priority.PRIORITY_HIGH_ACCURACY, 1000)
                      .setMinUpdateDistanceMeters(5f).build()
                  try { fused.requestLocationUpdates(req, callback, Looper.getMainLooper()) }
                  catch (e: SecurityException) { stopSelf() }
              }
              override fun onInit(status: Int) {
                  if (status != TextToSpeech.SUCCESS) return
                  VoiceConfig.apply(tts, this)
                  tts.setAudioAttributes(attrs)
                  tts.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                      override fun onStart(utteranceId: String?) {}
                      override fun onDone(utteranceId: String?) { if (utteranceId == "cam") abandonFocus() }
                      @Deprecated("Deprecated in Java")
                      override fun onError(utteranceId: String?) { abandonFocus() }
                  })
                  ttsReady = true
                  speak("단속카메라 알림을 시작할게요")
              }
              private fun handle(loc: Location) {
                  if (!loc.hasBearing() || loc.speed < 3f) return
                  val hit = CameraMatcher.nextAhead(cameras, loc.latitude, loc.longitude, loc.bearing.toDouble())
                  if (hit == null) { lastId = null; lastLevel = Int.MAX_VALUE; return }
                  if (hit.camera.id != lastId) { lastId = hit.camera.id; lastLevel = Int.MAX_VALUE }
                  val level = levels.firstOrNull { hit.distance <= it && it < lastLevel } ?: return
                  lastLevel = level
                  val limitText = if (hit.camera.limit > 0) " 제한속도는 ${hit.camera.limit}킬로미터예요." else ""
                  val over = hit.camera.limit > 0 && loc.speed * 3.6 > hit.camera.limit
                  val warn = if (over) " 속도를 조금 줄여 주세요." else ""
                  speak("전방 ${level}미터 앞에 단속카메라가 있어요.$limitText$warn")
              }
              private fun speak(t: String) {
                  if (!ttsReady) return
                  requestFocus()
                  tts.playSilentUtterance(400, TextToSpeech.QUEUE_FLUSH, "pre")
                  tts.speak(t, TextToSpeech.QUEUE_ADD, null, "cam")
              }
              private fun requestFocus() {
                  val req = AudioFocusRequest.Builder(AudioManager.AUDIOFOCUS_GAIN_TRANSIENT_MAY_DUCK)
                      .setAudioAttributes(attrs).build()
                  focusReq = req
                  audio.requestAudioFocus(req)
              }
              private fun abandonFocus() {
                  focusReq?.let { audio.abandonAudioFocusRequest(it) }
                  focusReq = null
              }
              override fun onDestroy() {
                  fused.removeLocationUpdates(callback)
                  tts.stop()
                  tts.shutdown()
                  abandonFocus()
                  super.onDestroy()
              }
              override fun onBind(i: Intent?): IBinder? = null
          }
          EOF_SRC
          mkdir -p app/src/main/java/com/example/camalert
          cat > app/src/main/java/com/example/camalert/Camera.kt <<'EOF_SRC'
          package com.example.camalert
          import kotlin.math.*
          data class Camera(val id: String, val lat: Double, val lng: Double, val limit: Int, val type: String)
          data class Hit(val camera: Camera, val distance: Double)
          object CameraMatcher {
              private const val R = 6371000.0
              fun distance(lat1: Double, lng1: Double, lat2: Double, lng2: Double): Double {
                  val p1 = Math.toRadians(lat1); val p2 = Math.toRadians(lat2)
                  val dp = p2 - p1; val dl = Math.toRadians(lng2 - lng1)
                  val a = sin(dp / 2).pow(2) + cos(p1) * cos(p2) * sin(dl / 2).pow(2)
                  return 2 * R * asin(sqrt(a))
              }
              fun bearing(lat1: Double, lng1: Double, lat2: Double, lng2: Double): Double {
                  val p1 = Math.toRadians(lat1); val p2 = Math.toRadians(lat2)
                  val dl = Math.toRadians(lng2 - lng1)
                  val y = sin(dl) * cos(p2)
                  val x = cos(p1) * sin(p2) - sin(p1) * cos(p2) * cos(dl)
                  return (Math.toDegrees(atan2(y, x)) + 360) % 360
              }
              private fun angleDiff(a: Double, b: Double): Double {
                  val d = abs(a - b) % 360
                  return if (d > 180) 360 - d else d
              }
              /** 진행 방향 앞쪽 maxDist 이내에서 가장 가까운 카메라. */
              fun nextAhead(
                  cams: List<Camera>, lat: Double, lng: Double, heading: Double,
                  maxDist: Double = 600.0, maxAngle: Double = 35.0
              ): Hit? {
                  val dLat = maxDist / 111_000.0
                  val dLng = maxDist / (111_000.0 * cos(Math.toRadians(lat)))
                  var best: Hit? = null
                  for (c in cams) {
                      if (abs(c.lat - lat) > dLat || abs(c.lng - lng) > dLng) continue
                      val d = distance(lat, lng, c.lat, c.lng)
